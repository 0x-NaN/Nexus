# =============================================================
# Kill Switch | Codestreet 2026
# config/policy_rules.yaml
#
# Defines what the Policy Engine enforces.
# Loaded ONCE at startup. NOT runtime-editable via API.
# Changing rules requires a server restart — by design.
#
# Judge talking point: "A governance layer that exposes its own
# rules to live API mutation defeats the purpose of a governance
# layer. Rules are config — config is code — code requires a
# deployment cycle to change."
# =============================================================

rules:

  # -----------------------------------------------------------
  # 1. Kill Switch
  # Checked FIRST — before all other rules.
  # If state = 'killed', every transaction is denied immediately.
  # -----------------------------------------------------------
  kill_switch:
    enabled: true
    deny_reason: "kill_switch_active"

  # -----------------------------------------------------------
  # 2. Spend Cap
  # Compares (agent's cumulative spend + this transaction amount)
  # against the agent's spend_cap.
  # Two-tier: warn/flag before hard deny, so the dashboard shows
  # a warning state before the agent actually gets blocked.
  # -----------------------------------------------------------
  spend_cap:
    enabled: true
    # Flag (warn, but allow) at this % of cap
    flag_threshold_pct: 0.90
    flag_reason: "approaching_spend_cap"
    # Deny at this % of cap
    deny_threshold_pct: 1.00
    deny_reason: "exceeds_spend_cap"

  # -----------------------------------------------------------
  # 3. Scope Check
  # transaction.category must exactly match agent.category.
  # Any mismatch = immediate deny, regardless of amount.
  # -----------------------------------------------------------
  scope_check:
    enabled: true
    deny_reason: "off_scope_category"

  # -----------------------------------------------------------
  # 4. Burst Detection
  # Counts transactions for the agent in the last `window_seconds`.
  # Only evaluated for agents where rate_limit is set (non-null).
  # Uses the agent_recent_tx_rate DB view for the count.
  # -----------------------------------------------------------
  burst_detection:
    enabled: true
    window_seconds: 60
    deny_reason: "burst_limit_exceeded"

# -----------------------------------------------------------
# Evaluation order (hardcoded in policy engine, documented here)
# 1. kill_switch
# 2. scope_check
# 3. spend_cap
# 4. burst_detection
#
# First failing rule wins — evaluation stops on first deny.
# Flag (warn) does NOT stop evaluation; remaining rules still run.
# -----------------------------------------------------------
